server {
    server_name supadrupapp.xedoc.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /article/ {
        root /var/www/supadrupapp;
        try_files $uri /index.html;
    }

    location /post/ {
        root /var/www/supadrupapp;
        try_files $uri /index.html;
    }

    location /profile/ {
        root /var/www/supadrupapp;
        try_files $uri /index.html;
    }

    location = /write {
        root /var/www/supadrupapp;
        try_files $uri /index.html;
    }

    location / {
        root /var/www/supadrupapp;
        index index.html;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/supadrupapp.xedoc.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/supadrupapp.xedoc.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = supadrupapp.xedoc.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name supadrupapp.xedoc.ru;
    return 404; # managed by Certbot
}
